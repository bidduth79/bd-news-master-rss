name: Auto Update News RSS Feeds

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours automatically
  workflow_dispatch:      # Allows manual trigger anytime
  push:
    branches:
      - main
    paths-ignore:
      - 'master_rss.xml'
      - 'feeds/**'
      - 'all_feeds.opml'
      - 'index.html'

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 lxml requests

      - name: Generate Master & Individual RSS Feeds
        run: |
          python generate_feeds.py

      - name: Commit and Push Updated Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_rss.xml all_feeds.opml index.html feeds/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feeds [skip ci]" && git push)
